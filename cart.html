<!DOCTYPE html>
<html lang="en">

<head>

    <style>
        h1{
            animation: color 10s infinite;
        }

        @keyframes color{
            25%{color: purple;}
            50%{color: red;}
            75%{color: blue;}
            100%{color: green;}
        }
    </style>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>nhadzy resto - Cart</title>


    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- HEADER -->

<header class="header">

    <a href="home.html" class="logo">

        <span>Nhadzy</span> Resto

        <small>
            Ramen Made With Passion
        </small>

    </a>


    <nav>

        <a href="home.html">
            HOME
        </a>

        <a href="home.html#menu">
            MENU
        </a>

        <a href="cart.html" class="active">
            CART
        </a>

        <a href="checkout.html">
            CHECKOUT
        </a>

        <a href="home.html#about">
            ABOUT US
        </a>

    </nav>


    <div class="header-right">

        <div class="search">

            <input
                type="text" id="searchInput"
                placeholder="Search..."
            >

            <span>⌕</span>

        </div>

        <a href="cart.html" class="cart-button">
            🛒
            <span id="cartCount">
                0
            </span>
        </a>

    </div>

</header>


<!-- ================ 
   CART SECTION 
===================-->

<section class="cart-page">

    <h1 class="page-title">
        YOUR CART
    </h1>

    <div class="cart-table">

        <!-- CART HEADINGS -->
        <div class="cart-header">

            <span>ITEM</span>
            <span>PRICE</span>
            <span>QUANTITY</span>
            <span>SUBTOTAL</span>
            <span>ACTION</span>

        </div>

        <!-- CART PRODUCTS -->
        <div id="cartItems"></div>

    </div>

    <div class="cart-bottom">

        <button
            class="dark-btn"
            onclick="clearCart()"
        >
            Clear Cart
        </button>


        <div class="total-box">

            <strong>
                TOTAL:
            </strong>

            <span id="cartTotal">
                ₱0
            </span>

        </div>

    </div>

    <a
        href="checkout.html"
        class="red-btn checkout-btn"
    >
        PROCEED TO CHECKOUT
    </a>

</section>

<!-- FOOTER -->
<footer>

    <h2>
        Nhadzy Resto
    </h2>

    <p>
        Ramen Made With Passion
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>
